name: Strategy safeguards tests
on:
  push:
    branches:
      - fix/dashboard-data-integrity-2026-11-13
  pull_request:
    branches:
      - fix/dashboard-data-integrity-2026-11-13
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x vitest run src/lib/trading.test.ts
      - run: bun x tsc --noEmit
      - run: bun run build
